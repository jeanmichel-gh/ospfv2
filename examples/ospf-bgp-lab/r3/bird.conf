# BIRD 2 in AS 65001: r3, 10.255.1.3, iBGP with r1 and r2.
# Edit here, then "birdc configure" (or Load file in routescope).
router id 10.255.1.3;
log stderr all;

# Addresses come from containerlab after BIRD starts: look often.
protocol device { scan time 2; }

# Its loopback, to advertise.
protocol direct { ipv4; interface "lo"; }

# What it learns by BGP goes to the kernel.
protocol kernel {
  ipv4 { export where source = RTS_BGP; };
}

protocol static {
  ipv4;
  route 192.168.3.0/24 blackhole;
}

# iBGP: its peers are on its links, so next hops are direct.
template bgp as65001 {
  local as 65001;
  direct;
  hold time 9;
  keepalive time 3;
  connect retry time 5;
  ipv4 {
    import all;
    export where source = RTS_STATIC || net = 10.255.1.3/32;
  };
}

protocol bgp r1 from as65001 { neighbor 10.1.13.1 as 65001; }
protocol bgp r2 from as65001 { neighbor 10.1.23.1 as 65001; }
