# Three BGP speakers in one AS, 65001, peering with one another (iBGP,
# full mesh) over a triangle of links: r1 and r2 run FRR, r3 runs BIRD.
# Each advertises its loopback and a /24.
#
#              r1 10.255.1.1  192.168.1.0/24
#     eth1 /                  \ eth2
#   10.1.12.0/30          10.1.13.0/30
#     eth1 /                  \ eth2
#   r2 10.255.1.2 --------- r3 10.255.1.3
#   192.168.2.0/24  eth2  10.1.23.0/30  eth1  192.168.3.0/24
#
# Images: FRR (docker pull quay.io/frrouting/frr:10.2.1), and BIRD from
# ~/ospfv2 (docker compose --profile bird build bird).
# Start it from routescope's lab menu, or in this folder:
#   sudo containerlab deploy -t bgp-ibgp.clab.yml
name: bgp-ibgp

topology:
  defaults:
    labels: { routescope.protocols: bgp }
  nodes:
    r1:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      binds: [r1:/etc/frr]
      # frr.conf has them too; FRR can miss them on links wired after it starts.
      exec:
        - sh -c "ip addr add 10.1.12.1/30 dev eth1 2>/dev/null || true"
        - sh -c "ip addr add 10.1.13.1/30 dev eth2 2>/dev/null || true"
    r2:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      binds: [r2:/etc/frr]
      exec:
        - sh -c "ip addr add 10.1.12.2/30 dev eth1 2>/dev/null || true"
        - sh -c "ip addr add 10.1.23.1/30 dev eth2 2>/dev/null || true"
    r3:
      kind: linux
      image: ospfv2-bird:latest
      binds: [r3:/etc/bird]
      exec:
        - ip addr add 10.1.23.2/30 dev eth1
        - ip addr add 10.1.13.2/30 dev eth2
        - ip addr add 10.255.1.3/32 dev lo
  links:
    - { endpoints: ["r1:eth1", "r2:eth1"] }
    - { endpoints: ["r2:eth2", "r3:eth1"] }
    - { endpoints: ["r3:eth2", "r1:eth2"] }
