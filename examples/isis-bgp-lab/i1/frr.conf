frr version 10.2.1_git
frr defaults traditional
hostname i1
log stdout informational
ip forwarding
no ipv6 forwarding
service integrated-vtysh-config
!
! Its own /24, given to IS-IS as a redistributed (external) prefix.
ip route 172.16.1.0/24 blackhole
!
interface lo
 ip address 10.255.0.1/32
 ip router isis LAB
 isis passive
exit
!
interface eth1
 description to i2
 ip address 10.0.12.1/30
 ip router isis LAB
 isis network point-to-point
 isis circuit-type level-1
 isis hello-interval 1
 isis hello-multiplier 3
exit
!
interface eth2
 description to asbr
 ip address 10.0.14.1/30
 ip router isis LAB
 isis network point-to-point
 isis circuit-type level-1
 isis hello-interval 1
 isis hello-multiplier 3
exit
!
router isis LAB
 net 49.0001.0000.0000.0001.00
 is-type level-1
 metric-style wide
 lsp-gen-interval 1
 spf-interval 1
 redistribute ipv4 static level-1
exit
!
