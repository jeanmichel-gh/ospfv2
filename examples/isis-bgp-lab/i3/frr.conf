frr version 10.2.1_git
frr defaults traditional
hostname i3
log stdout informational
ip forwarding
no ipv6 forwarding
service integrated-vtysh-config
!
! Its own /24, given to IS-IS as a redistributed (external) prefix.
ip route 172.16.3.0/24 blackhole
!
interface lo
 ip address 10.255.0.3/32
 ip router isis LAB
 isis passive
exit
!
interface eth1
 description to asbr
 ip address 10.0.34.2/30
 ip router isis LAB
 isis network point-to-point
 isis circuit-type level-2-only
 isis hello-interval 1
 isis hello-multiplier 3
exit
!
router isis LAB
 net 49.0002.0000.0000.0003.00
 is-type level-2-only
 metric-style wide
 lsp-gen-interval 1
 spf-interval 1
 redistribute ipv4 static level-2
exit
!
