name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test

  # The core against FRRouting ospfd over veth links in network
  # namespaces: adjacency, database sync, authentication, routing tables
  # that must match FRR's, and routes in the kernel over netlink.
  interop-frr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq frr iproute2
      - run: sudo -E env "PATH=$PATH" OSPFV2_FRR=1 bundle exec ruby -Ilib -Itest test/integration/frr_interop_test.rb
      - run: sudo -E env "PATH=$PATH" OSPFV2_FRR=1 bundle exec ruby -Ilib -Itest test/integration/frr_spf_test.rb
      - run: sudo -E env "PATH=$PATH" OSPFV2_FRR=1 bundle exec ruby -Ilib -Itest test/integration/frr_abr_test.rb
      - run: sudo -E env "PATH=$PATH" OSPFV2_FRR=1 bundle exec ruby -Ilib -Itest test/integration/frr_stub_test.rb
      - run: sudo -E env "PATH=$PATH" OSPFV2_FRR=1 bundle exec ruby -Ilib -Itest test/integration/frr_nssa_test.rb
      - run: sudo -E env "PATH=$PATH" OSPFV2_FRR=1 bundle exec ruby -Ilib -Itest test/integration/frr_ecmp_test.rb
      - run: sudo -E env "PATH=$PATH" OSPFV2_FRR=1 bundle exec ruby -Ilib -Itest test/integration/frr_virtual_link_test.rb
      - run: sudo -E env "PATH=$PATH" bundle exec ruby -Ilib -Itest test/integration/netlink_test.rb

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test .
      - run: docker build -t ospfv2 . && docker run --rm ospfv2 check /app/examples/grid.yml

  # The router lab from docker-compose.yml, end to end, as in the user
  # guide: a lab folder from "ospfv2 lab new", sim, frr and ospfd up,
  # routes installed, configurations saved back to the lab folder with
  # the right owner, and ospfd's event stream. Same script as in the VM.
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: test/lab/lab_test.sh

  # The containerlab lab: "lab new --containerlab", deployed with
  # containerlab, a link failing and ospfd going round by BIRD.
  clab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: bash -c "$(curl -sL https://get.containerlab.dev)"
      - run: docker pull -q quay.io/frrouting/frr:10.2.1
      - run: test/lab/clab_test.sh

  # The BGP labs: three iBGP speakers in one AS (FRR, FRR, BIRD), then an
  # OSPF domain redistributed into BGP and carried into that AS.
  bgp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: bash -c "$(curl -sL https://get.containerlab.dev)"
      - run: docker pull -q quay.io/frrouting/frr:10.2.1
      - run: test/lab/bgp_test.sh ibgp
      - run: SKIP_BUILD= test/lab/bgp_test.sh ospf-bgp

  # Nokia SR Linux in a containerlab lab: the simulator and ospfd Full with
  # it, the simulated area's routes on ospfd through it. Its answers to a
  # few commands are kept as annotations, for routescope's driver.
  srl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: bash -c "$(curl -sL https://get.containerlab.dev)"
      - name: SR Linux image
        run: |
          img="$(ruby -ryaml -e 'puts YAML.load_file("examples/srl-lab/ospf-srl.clab.yml").dig("topology", "nodes", "srl", "image")')"
          docker pull -q "$img"
          archs="$(docker manifest inspect "$img" 2>/dev/null | ruby -rjson -e 'm = JSON.parse($stdin.read); puts Array(m["manifests"]).map { _1.dig("platform", "architecture") }.compact.uniq.join(" ")' || true)"
          echo "::notice title=SR Linux image::$img, architectures: ${archs:-one, $(docker image inspect -f '{{.Architecture}}' "$img")}"
      - run: SRL_PROBE_DIR="$RUNNER_TEMP/srl-probe" test/lab/srl_test.sh
      - name: what SR Linux answered
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/srl-probe/*.txt; do
            [ -f "$f" ] || continue
            echo "::notice title=SR Linux $(basename "$f" .txt)::$(head -c 3800 "$f" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          done
