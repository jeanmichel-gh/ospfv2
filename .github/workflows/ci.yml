name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test

  # The core against FRRouting ospfd over veth links in network
  # namespaces: adjacency, database sync, authentication, routing tables
  # that must match FRR's, and routes in the kernel over netlink.
  interop-frr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq frr iproute2
      - run: sudo -E env "PATH=$PATH" OSPFV2_FRR=1 bundle exec ruby -Ilib -Itest test/integration/frr_interop_test.rb
      - run: sudo -E env "PATH=$PATH" OSPFV2_FRR=1 bundle exec ruby -Ilib -Itest test/integration/frr_spf_test.rb
      - run: sudo -E env "PATH=$PATH" bundle exec ruby -Ilib -Itest test/integration/netlink_test.rb

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test .
      - run: docker build -t ospfv2 . && docker run --rm ospfv2 check /app/examples/grid.yml
