name: Capture

# Real router output for routescope's unit test fixtures: the ospf-bgp
# lab up, then test/capture/bgp_capture.sh prints what FRR 10.2.1 and
# BIRD answer to routescope's BGP driver commands, to the job log. Runs
# on demand, and on a push that changes the script or this file.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/capture.yml
      - test/capture/**

jobs:
  bgp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: containerlab
        run: |
          bash -c "$(curl -sL https://get.containerlab.dev)"
          test/lab/pull.sh quay.io/frrouting/frr:10.2.1
      - name: ospf-bgp lab up
        run: BGP_TEST_DIR="$RUNNER_TEMP/bgptest" KEEP_LAB=1 test/lab/bgp_test.sh ospf-bgp
      - name: capture
        run: bash test/capture/bgp_capture.sh
