# BIRD 2 on the lab segment: 4.4.4.4, priority 0, so FRR stays the DR.
# Edit here, then "birdc configure" (or Apply in routescope) to load it.
router id 4.4.4.4;
log stderr all;

protocol device {}

# OSPF routes into the container's kernel, as a router would.
protocol kernel {
  ipv4 { export where source = RTS_OSPF; };
}

protocol ospf v2 ospf1 {
  ipv4 { import all; export none; };
  area 0 {
    interface "eth0" {
      type broadcast;
      hello 2;
      dead 8;
      priority 0;
      cost 10;
    };
  };
}
