frr version 10.2.1_git
frr defaults traditional
hostname asbr
log stdout informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 2.2.2.2/32
 ip ospf area 0.0.0.0
exit
!
interface eth1
 description LAN with the simulator
 ip address 10.99.0.20/24
 ip ospf area 0.0.0.0
 ip ospf dead-interval 8
 ip ospf hello-interval 2
 ip ospf priority 10
exit
!
interface eth2
 description to ospfd
 ip address 10.0.23.1/30
 ip ospf area 0.0.0.0
 ip ospf dead-interval 8
 ip ospf hello-interval 2
 ip ospf network point-to-point
exit
!
interface eth3
 description to r1, AS 65001
 ip address 10.1.100.1/30
exit
!
router ospf
 ospf router-id 2.2.2.2
exit
!
! AS 65000's border: what OSPF knows goes to AS 65001 by eBGP.
router bgp 65000
 bgp router-id 2.2.2.2
 no bgp ebgp-requires-policy
 timers bgp 3 9
 neighbor 10.1.100.2 remote-as 65001
 neighbor 10.1.100.2 description r1, AS 65001
 neighbor 10.1.100.2 timers connect 5
 !
 address-family ipv4 unicast
  network 2.2.2.2/32
  network 10.99.0.0/24
  network 10.0.23.0/30
  redistribute ospf
 exit-address-family
exit
!
