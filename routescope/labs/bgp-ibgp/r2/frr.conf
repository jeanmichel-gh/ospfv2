frr version 10.2.1_git
frr defaults traditional
hostname r2
log stdout informational
no ipv6 forwarding
service integrated-vtysh-config
!
ip route 192.168.2.0/24 blackhole
!
interface lo
 ip address 10.255.1.2/32
exit
!
interface eth1
 description to r1
 ip address 10.1.12.2/30
exit
!
interface eth2
 description to r3
 ip address 10.1.23.1/30
exit
!
router bgp 65001
 bgp router-id 10.255.1.2
 no bgp ebgp-requires-policy
 timers bgp 3 9
 neighbor 10.1.12.1 remote-as 65001
 neighbor 10.1.12.1 description r1
 neighbor 10.1.12.1 timers connect 5
 neighbor 10.1.23.2 remote-as 65001
 neighbor 10.1.23.2 description r3
 neighbor 10.1.23.2 timers connect 5
 !
 address-family ipv4 unicast
  network 10.255.1.2/32
  network 192.168.2.0/24
 exit-address-family
exit
!
