# ospfd with SR-MPLS between two FRR routers. See ../ospf-sr-frr.clab.yml.
set routing-options router-id 10.255.0.3
set protocols ospf source-packet-routing srgb start-label 18000 index-range 8000
set protocols ospf source-packet-routing srlb start-label 15000 index-range 1000
set protocols ospf source-packet-routing node-segment ipv4-index 3
set protocols ospf area 0.0.0.0 interface eth1 interface-type p2p
set protocols ospf area 0.0.0.0 interface eth1 hello-interval 1
set protocols ospf area 0.0.0.0 interface eth1 dead-interval 4
set protocols ospf area 0.0.0.0 interface eth2 interface-type p2p
set protocols ospf area 0.0.0.0 interface eth2 hello-interval 1
set protocols ospf area 0.0.0.0 interface eth2 dead-interval 4
set protocols ospf area 0.0.0.0 interface lo passive
