# ospfd configuration, saved by commit
set routing-options router-id 1.1.1.1
set protocols ospf area 0.0.0.0 interface eth1 interface-type p2p
set protocols ospf area 0.0.0.0 interface eth1 hello-interval 2
set protocols ospf area 0.0.0.0 interface eth1 dead-interval 8
set protocols ospf area 0.0.0.0 interface eth1 bfd-liveness-detection minimum-interval 300
set protocols ospf area 0.0.0.0 interface eth1 bfd-liveness-detection multiplier 3
set protocols ospf area 0.0.0.0 interface lo passive
