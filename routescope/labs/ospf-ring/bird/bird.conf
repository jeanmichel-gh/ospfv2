# BIRD 2 in the ring: 4.4.4.4, point-to-point to ospfd and to FRR.
# Edit here, then "birdc configure" (or Load file in routescope).
router id 4.4.4.4;
log stderr all;

# Addresses come from containerlab after BIRD starts: look often.
protocol device { scan time 2; }

protocol kernel {
  ipv4 { export where source = RTS_OSPF; };
}

protocol ospf v2 ospf1 {
  ipv4 { import all; export none; };
  area 0 {
    interface "eth1", "eth2" {
      type ptp;
      hello 2;
      dead 8;
      cost 10;
    };
    interface "lo" { stub; };
  };
}
