frr version 10.2.1_git
frr defaults traditional
hostname asbr
log stdout informational
ip forwarding
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.4/32
 ip router isis LAB
 isis passive
exit
!
interface eth1
 description to i1, level 1
 ip address 10.0.14.2/30
 ip router isis LAB
 isis network point-to-point
 isis circuit-type level-1
 isis hello-interval 1
 isis hello-multiplier 3
exit
!
interface eth2
 description to i2, level 1
 ip address 10.0.24.2/30
 ip router isis LAB
 isis network point-to-point
 isis circuit-type level-1
 isis hello-interval 1
 isis hello-multiplier 3
exit
!
interface eth3
 description to i3, level 2
 ip address 10.0.34.1/30
 ip router isis LAB
 isis network point-to-point
 isis circuit-type level-2-only
 isis hello-interval 1
 isis hello-multiplier 3
exit
!
interface eth4
 description to r1, AS 65001
 ip address 10.1.100.1/30
exit
!
router isis LAB
 net 49.0001.0000.0000.0004.00
 is-type level-1-2
 metric-style wide
 lsp-gen-interval 1
 spf-interval 1
 ! Level 1 routers (i1, i2) get their default from the attached bit this
 ! router sets, being in touch with another area. i3, at level 2, gets it
 ! here: FRR does not carry level 1 prefixes into level 2.
 default-information originate ipv4 level-2 always
exit
!
! Which IS-IS routes go to AS 65001, and how. Area 49.0002's (i3's) go
! with community 65000:2. To keep them out of BGP instead, make entry 10
! "deny". (FRR's IS-IS does not carry route tags, so a prefix list it is.)
ip prefix-list AREA-2 seq 5 permit 10.255.0.3/32
ip prefix-list AREA-2 seq 10 permit 172.16.3.0/24
!
route-map ISIS-TO-BGP permit 10
 match ip address prefix-list AREA-2
 set community 65000:2
exit
!
route-map ISIS-TO-BGP permit 20
exit
!
! AS 65000's border: what IS-IS knows goes to AS 65001 by eBGP, its
! IS-IS metric as the MED.
router bgp 65000
 bgp router-id 10.255.0.4
 no bgp ebgp-requires-policy
 timers bgp 3 9
 neighbor 10.1.100.2 remote-as 65001
 neighbor 10.1.100.2 description r1, AS 65001
 neighbor 10.1.100.2 timers connect 5
 !
 address-family ipv4 unicast
  network 10.255.0.4/32
  network 10.0.14.0/30
  network 10.0.24.0/30
  network 10.0.34.0/30
  redistribute isis route-map ISIS-TO-BGP
  neighbor 10.1.100.2 send-community
 exit-address-family
exit
!
