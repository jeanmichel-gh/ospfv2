# Two ways to use this file:
#
#   docker compose up ospfv2           your topology against a real router on the
#                                      host network. Put it in ./lab.yml first
#                                      (ospfv2 init > lab.yml), dashboard on :8080.
#
#   The router lab, on a bridge (10.99.0.0/24), from a lab folder:
#
#   docker compose --profile lab up    the simulator floods a 5x5 grid to a second
#                                      ospfv2 using real raw sockets. Dashboards on
#                                      :8080 (simulator) and :8081 (peer).
#
#   docker compose --profile frr up -d sim frr
#                                      the same simulator against FRRouting ospfd,
#                                      then: docker compose exec frr vtysh -c "show ip ospf neighbor"
#
#   docker compose --profile bird up -d bird
#                                      BIRD 2 as a fourth router (10.99.0.40).
#
#   docker compose up -d ospfd         ospfd as a third router, once the simulator
#                                      is Full. Its socket is on the ospfd-run volume:
#                                      docker compose exec ospfd ospf-cli
#
# The lab folder holds one folder per node (sim/, peer/, frr/, ospfd/), each
# mounted read-write, so configurations saved in the lab land back there.
# LAB selects it; without it, the template in examples/lab is used. Make your
# own copy before changing configurations:
#
#   bin/ospfv2 lab new ~/labs/ospf-lab
#   export LAB=~/labs/ospf-lab
#
# A LAB folder that does not exist is an error (create_host_path: false),
# not an empty folder Docker makes as root.

x-ospfv2: &ospfv2
  build: .
  image: ospfv2:latest
  cap_drop: [ALL]
  cap_add: [NET_RAW]
  restart: "no"

services:
  ospfv2:
    <<: *ospfv2
    network_mode: host
    volumes:
      - ./lab.yml:/work/lab.yml:ro
    command: ["run", "/work/lab.yml", "--web", "0.0.0.0:8080", "--log", "-"]

  sim:
    hostname: sim
    <<: *ospfv2
    profiles: [lab, frr]
    networks:
      ospflab:
        ipv4_address: 10.99.0.10
    ports: ["8080:8080"]
    volumes:
      - type: bind
        source: ${LAB:-./examples/lab}/sim
        target: /lab
        bind: { create_host_path: false }
    command: ["run", "/lab/sim.yml", "--web", "0.0.0.0:8080", "--log", "/tmp/ospfv2.log"]

  peer:
    hostname: peer
    <<: *ospfv2
    profiles: [lab]
    networks:
      ospflab:
        ipv4_address: 10.99.0.20
    ports: ["8081:8080"]
    volumes:
      - type: bind
        source: ${LAB:-./examples/lab}/peer
        target: /lab
        bind: { create_host_path: false }
    command: ["run", "/lab/peer.yml", "--web", "0.0.0.0:8080", "--log", "/tmp/ospfv2.log"]

  frr:
    hostname: frr
    profiles: [frr]
    image: quay.io/frrouting/frr:10.2.1
    cap_add: [NET_ADMIN, NET_RAW, SYS_ADMIN]
    networks:
      ospflab:
        ipv4_address: 10.99.0.20
    volumes:
      - type: bind
        source: ${LAB:-./examples/lab}/frr
        target: /etc/frr
        bind: { create_host_path: false }
      # The start script comes from the repo, not the lab folder, so lab
      # folders made before it existed work too.
      - ./examples/lab/tools:/lab-tools:ro
    # FRR's own start, plus giving frr.conf back to the lab folder's owner
    # after each write memory. See examples/lab/tools/frr-start.sh.
    entrypoint: ["/sbin/tini", "--", "sh", "/lab-tools/frr-start.sh"]

  ospfd:
    hostname: ospfd
    <<: *ospfv2
    profiles: [ospfd]
    # Docker's default capabilities, as with docker run: commit rewrites the
    # configuration in the mounted folder, which needs root's file access.
    cap_drop: []
    cap_add: [NET_RAW, NET_ADMIN]
    networks:
      ospflab:
        ipv4_address: 10.99.0.30
    volumes:
      - type: bind
        source: ${LAB:-./examples/lab}/ospfd
        target: /etc/ospfv2
        bind: { create_host_path: false }
      - ospfd-run:/run/ospfv2
    entrypoint: ["ospfd"]
    command: []

  # BIRD 2, a fourth router: docker compose --profile bird up -d bird
  bird:
    hostname: bird
    profiles: [bird]
    build: { context: docker/bird }
    image: ospfv2-bird:latest
    cap_add: [NET_ADMIN, NET_RAW]
    networks:
      ospflab:
        ipv4_address: 10.99.0.40
    volumes:
      - type: bind
        source: ${LAB:-./examples/lab}/bird
        target: /etc/bird
        bind: { create_host_path: false }

networks:
  ospflab:
    ipam:
      config:
        - subnet: 10.99.0.0/24

volumes:
  ospfd-run:
