<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 432" role="img" aria-label="ospfd joins FRR and the simulator on a Docker bridge in the VM" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="432" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">ospfd joins FRR and the simulator on a Docker bridge in the VM</text>
  <rect x="24" y="48" width="712" height="360" rx="8" fill="none" stroke="#8c8c88" stroke-width="1.25"/>
  <text x="40" y="72" font-weight="600" fill="#1f2328">MacBook</text>
  <text x="112" y="72" font-size="11.5" fill="#59636e">QEMU forwards localhost:2222 to SSH and :8080 to the simulator dashboard</text>
  <rect x="40" y="88" width="680" height="288" rx="8" fill="none" stroke="#8c8c88" stroke-width="1.25"/>
  <text x="56" y="112" font-weight="600" fill="#1f2328">Ubuntu 26.04 VM</text>
  <g fill="none" stroke="#8c8c88">
    <line x1="72" y1="240" x2="688" y2="240" stroke-width="2"/>
    <line x1="380" y1="200" x2="380" y2="240" stroke-width="1.25"/>
    <line x1="172" y1="240" x2="172" y2="272" stroke-width="1.25"/>
    <line x1="380" y1="240" x2="380" y2="272" stroke-width="1.25"/>
    <line x1="588" y1="240" x2="588" y2="272" stroke-width="1.25"/>
  </g>
  <text x="72" y="230" font-size="11.5" fill="#59636e">Docker bridge ospfv2_ospflab, 10.99.0.0/24</text>
  <rect x="250" y="128" width="260" height="72" rx="8" fill="#2f6fd6" fill-opacity="0.12" stroke="#2f6fd6" stroke-width="2"/>
  <text x="380" y="152" text-anchor="middle" font-weight="600" fill="#1f2328">ospfd on the VM (2a)</text>
  <text x="380" y="170" text-anchor="middle" font-size="11.5" fill="#1f2328">10.99.0.1 · router 3.3.3.3</text>
  <text x="380" y="186" text-anchor="middle" font-size="11.5" fill="#59636e">routes into the VM kernel</text>
  <rect x="72" y="272" width="200" height="88" rx="8" fill="none" stroke="#8c8c88" stroke-width="1.25"/>
  <text x="172" y="296" text-anchor="middle" font-weight="600" fill="#1f2328">sim container</text>
  <text x="172" y="314" text-anchor="middle" font-size="11.5" fill="#1f2328">10.99.0.10 · router 1.1.1.1</text>
  <text x="172" y="330" text-anchor="middle" font-size="11.5" fill="#59636e">5x5 grid, 50 summaries,</text>
  <text x="172" y="346" text-anchor="middle" font-size="11.5" fill="#59636e">200 externals</text>
  <rect x="280" y="272" width="200" height="88" rx="8" fill="none" stroke="#8c8c88" stroke-width="1.25"/>
  <text x="380" y="296" text-anchor="middle" font-weight="600" fill="#1f2328">frr container</text>
  <text x="380" y="314" text-anchor="middle" font-size="11.5" fill="#1f2328">10.99.0.20 · router 2.2.2.2</text>
  <text x="380" y="330" text-anchor="middle" font-size="11.5" fill="#59636e">FRRouting ospfd, the DR</text>
  <rect x="488" y="272" width="200" height="88" rx="8" fill="#2f6fd6" fill-opacity="0.12" stroke="#2f6fd6" stroke-width="2"/>
  <text x="588" y="296" text-anchor="middle" font-weight="600" fill="#1f2328">ospfd container (2b)</text>
  <text x="588" y="314" text-anchor="middle" font-size="11.5" fill="#1f2328">10.99.0.30 · router 3.3.3.3</text>
  <text x="588" y="330" text-anchor="middle" font-size="11.5" fill="#59636e">routes into its own table</text>
  <text x="40" y="396" font-size="11.5" fill="#59636e">Highlighted: ospfd. Run one at a time, on the VM (2a) or in a container (2b), priority 0.</text>
</svg>
